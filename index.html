<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="门口">
<meta name="theme-color" content="#05060a">
<title>门口</title>
<style>
:root{
  --ink:#f2f4f7; --dim:#9ba3ae; --faint:#6b7280;
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.085);
  --stroke:rgba(255,255,255,.11);
  --blue:#0a84ff; --green:#30d158;
  --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  letter-spacing:-.01em;
  background:#05060a;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 28px);
  overflow-x:hidden;
}
/* 背景光晕 */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;pointer-events:none}
body::before{width:420px;height:420px;left:-140px;top:-120px;background:radial-gradient(circle,#1d4ed8,transparent 68%);animation:drift 22s ease-in-out infinite alternate}
body::after{width:380px;height:380px;right:-150px;top:38%;background:radial-gradient(circle,#0f766e,transparent 70%);animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(40px,60px,0) scale(1.15)}}

/* 顶部 */
header{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 4px 18px}
h1{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em;margin:0}
#st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--dim);
  padding:6px 12px;border-radius:999px;background:var(--glass);border:.5px solid var(--stroke);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
#st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);transition:.3s}
#st.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
#st.bad::before{background:#ff453a}

/* 玻璃容器 */
.glass{
  background:var(--glass);
  border:.5px solid var(--stroke);
  border-radius:var(--r);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset, 0 18px 40px -22px rgba(0,0,0,.9);
  overflow:hidden;
}

/* 画面卡 */
.stage{margin-bottom:18px;position:relative;overflow:hidden}
video{width:100%;aspect-ratio:3/4;background:#000;display:none;object-fit:cover}
#img{display:none;width:100%;max-height:52vh;object-fit:cover}
.ph{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--ink3);font-size:14px;letter-spacing:.02em}
.ph .ico{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:.5px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.ph.hide{display:none}
.stage .cap{
  display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:13.5px;color:var(--dim);
  border-top:.5px solid rgba(255,255,255,.07)
}
.stage .cap b{font-weight:600;color:var(--ink);font-size:13px;letter-spacing:.02em;
  padding:3px 9px;border-radius:9px;background:rgba(255,255,255,.09)}
#now{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 分段控件 */
.seg{display:flex;gap:4px;padding:4px;margin:0 0 16px;border-radius:999px;
  background:rgba(255,255,255,.05);border:.5px solid var(--stroke);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.seg button{flex:1;border:none;background:none;color:var(--dim);font:inherit;font-size:13.5px;font-weight:500;
  padding:9px 4px;border-radius:999px;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .22s,color .22s}
.seg button.on{background:rgba(255,255,255,.14);color:var(--ink);font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 16px -8px rgba(0,0,0,.8)}
.seg button:active{transform:scale(.96)}

/* 记录卡 */
#recCard{border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.rec{display:flex;align-items:center;gap:12px;padding:15px 18px;position:relative;
  border-bottom:.5px solid rgba(255,255,255,.07);transition:background .18s,transform .18s}
.rec:last-child{border-bottom:none}
.rec:active{background:rgba(255,255,255,.07);transform:scale(.985)}
.rec .t{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:82px;letter-spacing:.01em}
.rec .n{flex:1;font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .go{font-size:12.5px;color:var(--blue);font-weight:500;opacity:.9}
.tag{font-size:11px;padding:2px 7px;border-radius:7px;background:rgba(48,209,88,.16);color:#4ade80;
  margin-left:7px;font-weight:600;letter-spacing:.02em}
.empty{color:var(--faint);font-size:14.5px;padding:34px 20px;text-align:center}

/* 按钮 */
.btns{display:grid;gap:10px;margin-top:4px}
button.act{font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;
  border:none;border-radius:20px;padding:16px;width:100%;color:var(--ink);
  background:var(--glass-hi);border:.5px solid var(--stroke);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),opacity .16s}
button.act:active{transform:scale(.972);opacity:.85}
button.pri{background:linear-gradient(180deg,#3b9dff,#0a6cff);border-color:rgba(255,255,255,.22);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 12px 30px -12px rgba(10,132,255,.9)}
button.ghost{background:transparent;box-shadow:none}

/* 设置页 */
.field{display:block;margin:0 0 16px}
.field label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--faint);margin:0 0 7px 4px}
.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:14px 16px;
  border-radius:18px;background:rgba(255,255,255,.06);border:.5px solid var(--stroke);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);outline:none;transition:.2s}
.field input:focus{background:rgba(255,255,255,.1);border-color:rgba(10,132,255,.6);
  box-shadow:0 0 0 3.5px rgba(10,132,255,.18)}
.pad{padding:22px 20px}
.sec-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:26px 4px 12px}
#msg,#dbg{font-size:12.5px;margin:14px 4px;white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.6}
#msg{color:#ffd60a}
#dbg{color:#78818f;max-height:240px;overflow:auto;padding:14px;border-radius:18px;
  background:rgba(0,0,0,.32);border:.5px solid rgba(255,255,255,.06)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>门口</h1>
  <span id="st">未连接</span>
</header>

<div id="viewMain">
  <div class="glass stage">
    <video id="v" playsinline muted controls></video>
    <img id="img" alt="">
    <div class="ph" id="ph">
      <div class="ico">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:#8e8e93">
          <path d="M3 8.5V6a2 2 0 0 1 2-2h2.5M21 8.5V6a2 2 0 0 0-2-2h-2.5M3 15.5V18a2 2 0 0 0 2 2h2.5M21 15.5V18a2 2 0 0 1-2 2h-2.5"/>
          <circle cx="12" cy="12" r="2.6"/>
        </svg>
      </div>
      <div>点下方按钮加载画面</div>
    </div>
    <div class="cap"><b id="mode">实时</b><span id="now"></span></div>
  </div>

  <div class="seg">
    <button class="on" id="fAll" onclick="setFilter('all')">全部</button>
    <button id="fHuman" onclick="setFilter('human')">人形</button>
    <button id="fOpen" onclick="setFilter('open')">开关门</button>
  </div>

  <div class="glass" id="recCard"></div>

  <div class="btns">
    <button class="act pri" onclick="refreshLive()">看实时画面</button>
    <button class="act" onclick="loadRec()">刷新记录</button>
    <button class="act ghost" onclick="toggleSetup()">设置与诊断</button>
  </div>
</div>

<div id="viewSetup" class="hide">
  <div class="sec-title">连接设置</div>
  <div class="glass pad">
    <div class="field"><label>AppKey</label><input id="k" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>AppSecret</label><input id="s" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>门锁序列号</label><input id="lock" autocapitalize="off" placeholder="留空 = 全部告警"></div>
    <div class="field"><label>摄像头序列号</label><input id="cam" autocapitalize="off" placeholder="共享设备可留空"></div>
    <div class="field" style="margin-bottom:6px"><label>摄像头通道</label><input id="ch" value="1" inputmode="numeric"></div>
  </div>
  <div class="btns" style="margin-top:16px">
    <button class="act pri" onclick="save()">保存并测试</button>
    <button class="act" onclick="diagnose()">运行诊断</button>
    <button class="act ghost" onclick="toggleSetup()">返回</button>
  </div>
  <div id="msg"></div>
  <div id="dbg"></div>
</div>

<script>
const API = 'https://open.ys7.com/api/lapp/';
let tok = null, tokExp = 0, timer = null, filter = 'all', alarms = [];
const $ = id => document.getElementById(id);
const cfg = () => JSON.parse(localStorage.getItem('ezcfg') || '{}');
const log = t => { $('dbg').textContent = t + '\n' + $('dbg').textContent; };
function status(t, ok) {
  const el = $('st');
  el.textContent = t;
  el.classList.remove('ok', 'bad');
  if (ok === true) el.classList.add('ok');
  if (ok === false) el.classList.add('bad');
}

function enc(o) {
  return Object.keys(o).filter(k => o[k] !== '' && o[k] != null)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
}
async function post(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: enc(body)
  });
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(path + ' 非JSON: ' + txt.slice(0, 80)); }
  if (j.code !== '200') throw new Error(`${path} → ${j.code} ${j.msg || ''}`);
  return j.data;
}
async function getToken(force) {
  const c = cfg();
  if (!c.appKey || !c.appSecret) throw new Error('先在设置里填 AppKey / AppSecret');
  if (!tok) { tok = localStorage.getItem('tk_' + c.appKey); tokExp = +localStorage.getItem('tke_' + c.appKey) || 0; }
  if (!force && tok && Date.now() < tokExp) { status('已连接', true); return tok; }
  const d = await post('token/get', { appKey: c.appKey, appSecret: c.appSecret });
  tok = d.accessToken;
  tokExp = (d.expireTime || Date.now() + 6e6) - 120000;
  localStorage.setItem('tk_' + c.appKey, tok);
  localStorage.setItem('tke_' + c.appKey, String(tokExp));
  status('已连接', true);
  return tok;
}

/* ---------- 实时 ---------- */
async function refreshLive() {
  $('mode').textContent = '实时'; $('now').textContent = '';
  const c = cfg();
  if (!c.cam) { $('mode').textContent = '抓拍'; return showLatestPic('门锁抓拍'); }
  try {
    const t = await getToken();
    const d = await post('live/address/get', {
      accessToken: t, source: c.cam + ':' + (c.ch || 1),
      protocol: 'hls', quality: 1, expireTime: 82800, supportH265: 0
    });
    showVideo(d.url);
  } catch (e) {
    $('mode').textContent = '抓拍';
    const m = e.message || '';
    let why = '共享设备不支持实时';
    if (/20018|own the device/i.test(m)) why = '共享设备不支持实时';
    else if (/10001/.test(m)) why = '设备不支持';
    else why = '取流失败';
    log('live: ' + m);
    return showLatestPic(why);
  }
}

async function showLatestPic(why) {
  try {
    const t = await getToken();
    const r = await post('alarm/list', { accessToken: t, pageStart: 0, pageSize: 6, deviceSerial: cfg().lock || cfg().cam });
    const arr = Array.isArray(r) ? r : ((r && (r.alarmList || r.list)) || []);
    const a = arr.find(x => x.alarmPicUrl) || arr[0];
    if (!a) { $('now').textContent = '暂无抓拍'; return; }
    let u = a.alarmPicUrl || '';
    if (!u) {
      try {
        const p = await post('alarm/picture', { accessToken: t, alarmId: a.alarmId });
        u = p.picUrl || p.url || (p.data && p.data.picUrl) || '';
      } catch (e3) { log('alarm/picture: ' + e3.message); }
    }
    if (u) showImg(u, (why && why !== '门锁抓拍' ? why + ' · ' : '') + '最近 ' + fmt(a.alarmTime));
    else $('now').textContent = why || '抓拍图获取失败';
  } catch (e2) { $('now').textContent = '⚠️ ' + e2.message; status('未连接', false); }
}

/* ---------- 回放 ---------- */
function ts(ms) { return Math.floor(ms / 1000); }
function fmt(ms) {
  const d = new Date(+ms), p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showImg(url, note) {
  const v = $('v'), img = $('img');
  if (v.pause) v.pause();
  v.style.display = 'none'; v.removeAttribute('src'); if (v.load) v.load();
  $('ph').classList.add('hide');
  img.style.display = 'block'; img.src = url;
  $('now').textContent = note || '';
}

function showVideo(url) {
  const v = $('v'), img = $('img');
  $('ph').classList.add('hide');
  img.style.display = 'none';
  v.style.display = 'block';
  v.src = url; v.play().catch(() => {});
}

async function playAt(ms, alarmId, picUrl) {
  const c = cfg();
  $('mode').textContent = '回放';
  if (picUrl) showImg(picUrl, fmt(ms) + ' · 抓拍');
  if (!c.cam) { if (!picUrl) $('now').textContent = fmt(ms) + ' · 未配置摄像头'; return; }

  const t1 = ms - 60000, t2 = ms + 120000;
  let t;
  try { t = await getToken(); } catch (e) { return; }

  for (const unit of ['sec', 'ms']) {
    const f = unit === 'sec' ? ts : v => v;
    try {
      const list = await post('cloud/video/list', {
        accessToken: t, deviceSerial: c.cam, channelNo: c.ch || 1,
        startTime: String(f(t1)), endTime: String(f(t2)),
        pageStart: 0, pageSize: 10
      });
      const arr = (list && (list.videoList || list.list)) || [];
      if (!arr.length) continue;
      const v0 = arr[0];
      const a = await post('cloud/video/address/get', {
        accessToken: t, deviceSerial: c.cam, channelNo: c.ch || 1,
        startTime: String(v0.startTime), endTime: String(v0.endTime),
        protocol: 'hls', quality: 1
      });
      showVideo(a.url);
      $('now').textContent = fmt(ms) + ' · 云录像';
      return;
    } catch (e) { log('cloud ' + unit + ': ' + e.message); }
  }
  if (!picUrl) $('now').textContent = fmt(ms) + ' · 该时段无录像';
}

/* ---------- 记录 ---------- */
const isHuman = a => /人|human|pir|body/i.test((a.alarmName || '') + (a.alarmType || ''));
const isOpen = a => /门|lock|门锁|open/i.test((a.alarmName || '') + (a.alarmType || ''));

function setFilter(f) {
  filter = f;
  ['fAll','fHuman','fOpen'].forEach(id => $(id).classList.remove('on'));
  $(f === 'all' ? 'fAll' : f === 'human' ? 'fHuman' : 'fOpen').classList.add('on');
  render();
}

function render() {
  const card = $('recCard');
  let list = alarms;
  if (filter === 'human') list = alarms.filter(isHuman);
  if (filter === 'open') list = alarms.filter(isOpen);
  if (!list.length) { card.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  card.innerHTML = list.map(a => {
    const t = +a.alarmTime, name = a.alarmName || ('告警 ' + (a.alarmType || ''));
    const tag = isHuman(a) ? '<span class="tag">人形</span>' : '';
    return `<div class="rec" onclick="playAt(${t},'${a.alarmId || ''}','${(a.alarmPicUrl || '').replace(/'/g, "%27")}')">
      <span class="t">${fmt(t)}</span>
      <span class="n">${name}${tag}</span>
      <span class="go">看抓拍 ›</span></div>`;
  }).join('');
}

async function loadRec() {
  const card = $('recCard');
  try {
    if (!alarms.length) card.innerHTML = '<div class="empty">加载中…</div>';
    const c = cfg(); const t = await getToken();
    const body = { accessToken: t, pageStart: 0, pageSize: 40 };
    if (c.lock) body.deviceSerial = c.lock;
    const d = await post('alarm/list', body);
    alarms = (d && (d.alarmList || d.list)) || (Array.isArray(d) ? d : []);
    render();
  } catch (e) {
    card.innerHTML = '<div class="empty">⚠️ ' + e.message + '</div>';
    status('未连接', false);
  }
}

/* ---------- 设置 / 诊断 ---------- */
function toggleSetup() {
  $('viewMain').classList.toggle('hide');
  $('viewSetup').classList.toggle('hide');
  if (!$('viewSetup').classList.contains('hide')) {
    const c = cfg();
    $('k').value = c.appKey || ''; $('s').value = c.appSecret || '';
    $('cam').value = c.cam || ''; $('lock').value = c.lock || ''; $('ch').value = c.ch || 1;
    $('msg').textContent = ''; $('dbg').textContent = '';
  }
}

async function save() {
  const c = {
    appKey: $('k').value.trim(), appSecret: $('s').value.trim(),
    cam: $('cam').value.trim(), lock: $('lock').value.trim(), ch: $('ch').value.trim() || 1
  };
  localStorage.setItem('ezcfg', JSON.stringify(c));
  tok = null; tokExp = 0;
  $('msg').textContent = '测试中…'; $('msg').style.color = '#ffd60a';
  try {
    await getToken(true);
    $('msg').textContent = '✅ 连接成功';
    $('msg').style.color = '#30d158';
    setTimeout(() => {
      toggleSetup(); refreshLive(); loadRec();
      if (!timer) timer = setInterval(loadRec, 60000);
    }, 700);
  } catch (e) {
    $('msg').textContent = '❌ ' + e.message;
    $('msg').style.color = '#ff453a';
    status('未连接', false);
  }
}

async function diagnose() {
  $('dbg').textContent = '';
  const c = cfg();
  try {
    const t = await getToken(true);
    log('token OK');
    const now = Date.now();
    const probes = [
      ['alarm/list', { accessToken: t, pageStart: 0, pageSize: 3 }],
      ['cloud/video/list', { accessToken: t, deviceSerial: c.cam, channelNo: c.ch || 1,
        startTime: String(ts(now - 86400000)), endTime: String(ts(now)), pageStart: 0, pageSize: 5 }],
      ['live/address/get', { accessToken: t, source: (c.cam || '') + ':' + (c.ch || 1),
        protocol: 'hls', quality: 1, expireTime: 600 }],
    ];
    for (const [p, b] of probes) {
      try { const d = await post(p, b); log(p + ' ✅ ' + JSON.stringify(d).slice(0, 160)); }
      catch (e) { log(p + ' ❌ ' + e.message); }
    }
  } catch (e) { log('❌ ' + e.message); }
}

(function init() {
  const c = cfg();
  if (c.appKey) {
    refreshLive(); loadRec();
    timer = setInterval(loadRec, 60000);
  } else {
    $('recCard').innerHTML = '<div class="empty">首次使用：点下方「设置与诊断」填 AppKey</div>';
  }
})();
</script>
</body>
</html>
